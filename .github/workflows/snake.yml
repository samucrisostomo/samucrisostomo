name: Gerar animacao da snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar SVG a partir do grid de contribuicoes
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: samucrisostomo
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#38BDF8

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
